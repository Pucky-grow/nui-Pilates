# Optional local/internal monitoring. No published ports and no external notifications.
services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:?Set independently reviewed and scanned immutable monitoring image}
    profiles: [monitoring]
    user: "65534:65534"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 0.3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d", "--storage.tsdb.retention.size=512MB", "--web.listen-address=:9090"]
    networks: [private]
volumes:
  prometheus-data:
