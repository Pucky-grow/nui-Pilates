pid /tmp/nginx.pid;
worker_processes auto;
events { worker_connections 1024; }
http {
 include /etc/nginx/mime.types;
 server_tokens off;
 resolver 127.0.0.11 valid=5s ipv6=off;
 upstream backend { zone backend 64k; server server:8080 resolve; }
 upstream frontend { zone frontend 64k; server admin:8081 resolve; }
 # No query string, Referer, request body, credentials or signed URL in access logs.
 log_format privacy '$remote_addr $request_method $uri $status $request_time';
 access_log /dev/stdout privacy;
 error_log /dev/stderr warn;
 client_body_temp_path /tmp/client_body;
 proxy_temp_path /tmp/proxy;
 server {
  listen 8443 ssl;
  server_name _;
  ssl_certificate /run/certs/fullchain.pem;
  ssl_certificate_key /run/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 6m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  location ^~ /actuator { return 404; }
  location ^~ /uploads/ { return 404; }
  location ^~ /media/access/ {
   # Nginx error logs can include a full request line; suppress them for signed URLs.
   error_log /dev/null;
   proxy_pass http://backend;
   proxy_set_header Host $host;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_set_header X-Forwarded-Proto https;
   proxy_buffering off;
  }
  location ~ ^/(api|media)/ {
   proxy_pass http://backend;
   proxy_set_header Host $host;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_set_header X-Forwarded-Proto https;
   proxy_connect_timeout 5s;
   proxy_read_timeout 30s;
   proxy_buffering off;
  }
  location = /health { proxy_pass http://backend; }
  location / { proxy_pass http://frontend; }
 }
}
