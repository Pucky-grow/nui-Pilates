global:
  scrape_interval: 30s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: pilates
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [server:9091]
        labels: {event_delivery: outbox}
