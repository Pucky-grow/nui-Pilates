route:
  receiver: operator
  group_by: [alertname, job, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: operator
    webhook_configs:
      - url_file: /run/secrets/alert_webhook_url
        send_resolved: true
        http_config:
          follow_redirects: false
