server:
  port: 8080
  servlet:
    context-path: /

spring:
  http:
    converters:
      preferred-json-mapper: jackson2
  jackson2:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  application:
    name: pilates-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 3600

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

logging:
  level:
    com.yoyi.pilates: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{40} - %msg%n"

# 业务配置
yoyi:
  studio-ledger:
    enabled: ${STUDIO_LEDGER_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET:yoyi-pilates-dev-secret-key-please-change-in-prod-0123456789abcdef}
    # 小程序 token 2 小时(登录保持, 超时自动退出重新登录); 后台 token 2 小时(毫秒)
    mp-ttl: 7200000
    admin-ttl: 7200000
  cors:
    # 生产通过 CORS_ALLOWED_ORIGINS 收紧到管理后台具体域名(逗号分隔)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  wx:
    appid: ${WX_APPID:}
    secret: ${WX_SECRET:}
    # dev 环境: true=不请求微信服务器, code 即 mock openid
    mock-login: ${WX_MOCK_LOGIN:false}
  sales:
    package-enabled: ${PACKAGE_SALES_ENABLED:false}
  sms:
    mock-enabled: ${SMS_MOCK_ENABLED:false}
  pay:
    mock-enabled: ${PAY_MOCK_ENABLED:false}
    mchid: ${WX_PAY_MCHID:}
    api-v3-key: ${WX_PAY_API_V3_KEY:}
    private-key-path: ${WX_PAY_PRIVATE_KEY_PATH:}
    cert-serial-no: ${WX_PAY_CERT_SERIAL_NO:}
    platform-cert-path: ${WX_PAY_PLATFORM_CERT_PATH:}
    notify-url: ${WX_PAY_NOTIFY_URL:https://your-domain.com/api/payment/wechat/callback}
  mq:
    # dev: in-memory 事件总线; prod: rocketmq
    type: ${MQ_TYPE:memory}
    rocketmq:
      namesrv: ${ROCKETMQ_NAMESRV:127.0.0.1:9876}
      producer-group: yoyi-pilates-producer
  upload:
    # 本地文件存储目录(头像/图片), 生产可替换为 OSS
    dir: ${UPLOAD_DIR:./uploads}
    url-prefix: /uploads
