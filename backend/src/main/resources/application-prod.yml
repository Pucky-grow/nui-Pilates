spring:
  sql:
    init:
      mode: never
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DATABASE_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 16
      minimum-idle: 2
      connection-timeout: 5000
      connection-init-sql: "SET time_zone = '+08:00'"
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USER:}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
      connect-timeout: 3s
      timeout: 3s
      ssl:
        enabled: ${REDIS_TLS:false}
        bundle: ${REDIS_SSL_BUNDLE:}
  ssl:
    bundle:
      pem:
        tencent-redis:
          truststore:
            certificate: ${REDIS_CA_CERT:classpath:certificates/tencent-redis-ca.pem}
server:
  shutdown: graceful
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    accesslog:
      enabled: false
spring.lifecycle.timeout-per-shutdown-phase: 30s
management:
  server:
    port: 9091
  endpoints.web.exposure.include: health,prometheus
  endpoint.health:
    show-details: never
    probes.enabled: true
    group:
      liveness.include: livenessState
      readiness.include: readinessState,db,redis
  metrics.tags.application: yoyi-pilates
logging.level:
  root: WARN
  com.yoyi.pilates: INFO
yoyi:
  public-base-url: ${PUBLIC_BASE_URL:}
  jwt.secret: ${JWT_SECRET:}
  cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  security.trusted-proxies: ${TRUSTED_PROXIES:}
  wx:
    login-enabled: ${WX_LOGIN_ENABLED:true}
    phone-enabled: ${WX_PHONE_ENABLED:false}
    subscribe-enabled: false
    mock-login: ${WX_MOCK_LOGIN:false}
  pay.initiation-enabled: false
  pay.refund-enabled: false
  pay.mock-enabled: ${PAY_MOCK_ENABLED:false}
  sms.mock-enabled: ${SMS_MOCK_ENABLED:false}
  sales.package-enabled: ${PACKAGE_SALES_ENABLED:false}
  mq.type: outbox
  scheduling.enabled: ${SCHEDULING_ENABLED:true}
  delivery.workers-enabled: ${DELIVERY_WORKERS_ENABLED:true}
  storage:
    type: ${STORAGE_TYPE:oss}
    cos:
      region: ${COS_REGION:}
      bucket: ${COS_BUCKET:}
      secret-id: ${COS_SECRET_ID:}
      secret-key: ${COS_SECRET_KEY:}
      session-token: ${COS_SESSION_TOKEN:}
    oss:
      endpoint: ${OSS_ENDPOINT:}
      bucket: ${OSS_BUCKET:}
      role-name: ${OSS_ROLE_NAME:}
      access-key-id: ${OSS_ACCESS_KEY_ID:}
      access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
      security-token: ${OSS_SECURITY_TOKEN:}
