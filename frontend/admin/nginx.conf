server {
 listen 8081;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 location / { try_files $uri $uri/ /index.html; }
 location = /index.html {
  add_header Cache-Control "no-store";
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
 }
 location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
 location /api/ { return 404; }
}
